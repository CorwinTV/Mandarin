<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandarin — Warframe Mandachord Editor</title>
  <meta name="description" content="Upload audio or MIDI and get a starting set of notes for Warframe Mandachord. Edit and refine the result in the built-in editor.">
  <link rel="icon" href="mandarin.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .upload-btn {
      display: inline-block;
      background: #fff;
      color: #000;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .upload-btn:hover { background: #ddd; }
    input[type="file"] { display: none; }
    .progress-wrap { display: none; margin-top: 24px; }
    .progress-wrap.visible { display: block; }
    .progress-bar {
      height: 6px; background: #222; border-radius: 3px;
      overflow: hidden; margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%; width: 0%; background: #4ecdc4;
      border-radius: 3px; transition: width 0.2s;
    }
    .status { font-size: 13px; color: #888; min-height: 20px; }
    .hint {
      margin-top: 20px; font-size: 12px; color: #555; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mandarin</h1>
    <p class="subtitle">
      Upload audio or MIDI.<br>
      Get a starting layout for Warframe Mandachord.
    </p>

    <label class="upload-btn" id="uploadLabel">
      Upload file
      <input type="file" id="fileInput"
        accept="audio/*,video/*,.mid,.midi,audio/midi,audio/x-midi">
    </label>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="status" id="status">Preparing…</div>
    </div>

    <p class="hint">
      Supported: MP3, WAV, OGG, M4A, MID, MIDI<br>
      Best results with short (~8s) melodies or isolated stems.<br>
      You’ll usually need to edit the notes afterward.
    </p>
  </div>

  <script type="module">
    import {
      BasicPitch,
      outputToNotesPoly,
      addPitchBendsToNoteEvents,
      noteFramesToTime
    } from "./vendor/basic-pitch.js";
    import MidiPkg from "./vendor/midi.js";
    const Midi = MidiPkg.Midi ?? MidiPkg;

    const fileInput = document.getElementById("fileInput");
    const uploadLabel = document.getElementById("uploadLabel");
    const progressWrap = document.getElementById("progressWrap");
    const progressFill = document.getElementById("progressFill");
    const statusEl = document.getElementById("status");

    function setProgress(pct, text) {
      progressWrap.classList.add("visible");
      progressFill.style.width = Math.min(100, Math.max(0, pct)) + "%";
      if (text) statusEl.textContent = text;
    }

    function goToEditor(filename, notes) {
      localStorage.setItem("mandarin_filename", filename);
      localStorage.setItem("mandarin_notes", JSON.stringify(notes));
      window.location.href = "editor.html";
    }

    async function processMidi(file) {
      setProgress(20, "Reading MIDI…");
      const midi = new Midi(await file.arrayBuffer());
      const notes = [];
      midi.tracks.forEach(track => {
        track.notes.forEach(n => {
          notes.push({ start: n.time, end: n.time + n.duration, midi: n.midi });
        });
      });
      const filtered = notes
        .filter(n => n.start < 10)
        .filter(n => n.midi >= 36 && n.midi <= 96)
        .sort((a, b) => a.start - b.start);
      setProgress(100, `Found ${filtered.length} notes…`);
      setTimeout(() => goToEditor(file.name, filtered), 250);
    }

    async function processAudio(file) {
      setProgress(5, "Decoding audio…");
      const arrayBuffer = await file.arrayBuffer();
      const audioCtx = new AudioContext({ sampleRate: 22050 });
      const decoded = await audioCtx.decodeAudioData(arrayBuffer);
      const length = decoded.length;
      const monoBuffer = audioCtx.createBuffer(1, length, decoded.sampleRate);
      const monoData = monoBuffer.getChannelData(0);

      if (decoded.numberOfChannels === 1) {
        monoData.set(decoded.getChannelData(0));
      } else {
        const left = decoded.getChannelData(0);
        const right = decoded.numberOfChannels > 1 ? decoded.getChannelData(1) : left;
        for (let i = 0; i < length; i++) monoData[i] = (left[i] + right[i]) * 0.5;
      }

      setProgress(15, "Loading Basic Pitch…");
      const basicPitch = new BasicPitch("./vendor/basic-pitch/model/model.json");
      const frames = [], onsets = [], contours = [];

      setProgress(25, "Analyzing…");
      await basicPitch.evaluateModel(
        monoBuffer,
        (f, o, c) => { frames.push(...f); onsets.push(...o); contours.push(...c); },
        (pct) => setProgress(25 + pct * 60, `Analyzing… ${Math.round(pct * 100)}%`)
      );

      setProgress(90, "Building notes…");
      const noteEvents = noteFramesToTime(
        addPitchBendsToNoteEvents(
          contours,
          outputToNotesPoly(frames, onsets, 0.5, 0.3, 5, true, null, null, false)
        )
      );

      const notes = noteEvents
        .filter(n => n.startTimeSeconds < 30)
        .filter(n => n.pitchMidi >= 21 && n.pitchMidi <= 108)
        .map(n => ({
          start: n.startTimeSeconds,
          end: n.startTimeSeconds + (n.durationSeconds || 0.12),
          midi: n.pitchMidi
        }))
        .filter(n => (n.end - n.start) >= 0.03)
        .sort((a, b) => a.start - b.start);

      await audioCtx.close();
      setProgress(100, `Found ${notes.length} notes…`);
      setTimeout(() => goToEditor(file.name, notes), 250);
    }

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      uploadLabel.style.pointerEvents = "none";
      uploadLabel.style.opacity = "0.5";
      setProgress(0, "Starting…");
      try {
        const name = file.name.toLowerCase();
        const isMidi =
          name.endsWith(".mid") || name.endsWith(".midi") ||
          file.type === "audio/midi" || file.type === "audio/x-midi";
        if (isMidi) await processMidi(file);
        else await processAudio(file);
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error: " + (err.message || String(err));
        progressFill.style.width = "0%";
        uploadLabel.style.pointerEvents = "";
        uploadLabel.style.opacity = "1";
      }
    });
  </script>
</body>
</html>
